
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOU ARE AN IDIOT!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: red;
  font-family: Arial, sans-serif;
}

.bouncer {
  position: absolute;
  font-size: clamp(24px, 5vw, 60px);
  font-weight: 1000;
  color: yellow;
  text-shadow: 4px 4px black;
  white-space: nowrap;
  user-select: none;
  pointer-events: none;
}

.controls {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  gap: 10px;
}

button {
  padding: 12px 20px;
  border: 3px solid black;
  border-radius: 8px;
  background: yellow;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="controls">
  <button onclick="playMusic()">PLAY MUSIC</button>
  <button onclick="stopMusic()">STOP MUSIC</button>
</div>

<audio id="music" loop>
  <source src="You are an idiot! - QuickSounds.com.mp3"
          type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("music");
const bouncers = [];

// Ask whether the visitor wants the MP3
const wantsDownload = confirm(
  "DO YOU WANT TO DOWNLOAD THE MP3?"
);

if (wantsDownload) {
  const link = document.createElement("a");

  link.href =
    "You are an idiot! - QuickSounds.com.mp3";

  link.download = "You are an idiot!.mp3";

  document.body.appendChild(link);
  link.click();
  link.remove();
}

// Create 10 bouncing messages
for (let i = 0; i < 10; i++) {
  const text = document.createElement("div");

  text.className = "bouncer";
  text.textContent = "YOU ARE AN IDIOT!";

  document.body.appendChild(text);

  bouncers.push({
    element: text,
    x: Math.random() * 300,
    y: Math.random() * 300,
    dx: (Math.random() < 0.5 ? -1 : 1) *
        (3 + Math.random() * 4),
    dy: (Math.random() < 0.5 ? -1 : 1) *
        (3 + Math.random() * 4)
  });
}

// Animate all messages
function animate() {
  for (const b of bouncers) {
    const maxX = Math.max(
      0, innerWidth - b.element.offsetWidth
    );

    const maxY = Math.max(
      0, innerHeight - b.element.offsetHeight
    );

    b.x += b.dx;
    b.y += b.dy;

    if (b.x <= 0 || b.x >= maxX) {
      b.dx *= -1;

      b.element.style.color =
        `hsl(${Math.random() * 360}, 100%, 50%)`;

      document.body.style.background =
        `hsl(${Math.random() * 360}, 100%, 50%)`;
    }

    if (b.y <= 0 || b.y >= maxY) {
      b.dy *= -1;
    }

    b.x = Math.max(0, Math.min(b.x, maxX));
    b.y = Math.max(0, Math.min(b.y, maxY));

    b.element.style.left = b.x + "px";
    b.element.style.top = b.y + "px";
  }

  requestAnimationFrame(animate);
}

// Music controls
function playMusic() {
  music.play().catch(() => {
    alert("Your browser couldn't play the MP3.");
  });
}

function stopMusic() {
  music.pause();
  music.currentTime = 0;
}

// Try autoplay (browser permission may block it)
window.addEventListener("load", playMusic);

animate();
</script>

</body>
</html>
