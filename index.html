
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOU ARE AN IDIOT!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      background: red;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    .bouncer {
      position: absolute;
      font-size: clamp(22px, 5vw, 60px);
      font-weight: bold;
      color: yellow;
      white-space: nowrap;
      text-shadow: 3px 3px black;
      user-select: none;
      pointer-events: none;
    }

    .controls {
      position: fixed;
      bottom: 18px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      z-index: 9999;
    }

    button {
      border: 3px solid black;
      border-radius: 12px;
      padding: 14px 20px;
      min-height: 48px;
      background: yellow;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <audio id="music" loop>
    <source src="You are an idiot! - QuickSounds.com.mp3" type="audio/mpeg">
  </audio>

  <div class="controls">
    <button onclick="multiply()">× MULTIPLY</button>
    <button onclick="playMusic()">▶ PLAY</button>
    <button onclick="stopMusic()">■ STOP</button>
  </div>

  <script>
    const music = document.getElementById("music");

    let bouncers = [];
    const MAX_BOUNCERS = 100;

    function addBouncer() {
      const element = document.createElement("div");
      element.className = "bouncer";
      element.textContent = "YOU ARE AN IDIOT!";

      document.body.appendChild(element);

      bouncers.push({
        element: element,
        x: Math.random() * Math.max(1, innerWidth - 250),
        y: Math.random() * Math.max(1, innerHeight - 70),
        dx: (Math.random() < 0.5 ? -1 : 1) * 2,
        dy: (Math.random() < 0.5 ? -1 : 1) * 2
      });
    }

    function multiply() {
      const current = bouncers.length;
      const target = Math.min(current * 2, MAX_BOUNCERS);

      for (let i = current; i < target; i++) {
        addBouncer();
      }
    }

    function animate() {
      document.body.style.backgroundColor =
        `hsl(${Math.random() * 360}, 100%, 50%)`;

      for (const b of bouncers) {
        const el = b.element;
        const maxX = Math.max(0, innerWidth - el.offsetWidth);
        const maxY = Math.max(0, innerHeight - el.offsetHeight - 90);

        b.x += b.dx;
        b.y += b.dy;

        if (b.x <= 0 || b.x >= maxX) b.dx *= -1;
        if (b.y <= 0 || b.y >= maxY) b.dy *= -1;

        b.x = Math.max(0, Math.min(b.x, maxX));
        b.y = Math.max(0, Math.min(b.y, maxY));

        el.style.left = b.x + "px";
        el.style.top = b.y + "px";
      }

      requestAnimationFrame(animate);
    }

    function playMusic() {
      music.play().catch(() => {
        alert("Tap PLAY again if your browser blocked the music.");
      });
    }

    function stopMusic() {
      music.pause();
      music.currentTime = 0;
    }

    addBouncer();
    requestAnimationFrame(animate);
  </script>

</body>
</html>
